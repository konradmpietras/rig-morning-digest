name: Publish digest preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render digest page
        env:
          LANE_ID: lane-07
          LANE_MARKER: ${{ vars.LANE_MARKER }}
        run: |
          pnpm start > /tmp/rig.log 2>&1 &
          echo $! > /tmp/rig.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/health >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p _site
          curl --fail --silent http://localhost:8787/digest/2026-10-28 -o _site/index.html
          kill "$(cat /tmp/rig.pid)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
